{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">Вход</h1>
<form method="post" class="col-md-6">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="btn btn-primary mt-3">Войти</button>
</form>
<p class="mt-3">
  <a href="{% url 'users:register' %}">Регистрация</a> ·
  <a href="{% url 'users:password_reset' %}">Забыли пароль?</a>
</p>
{% endblock %}
