{% extends "base.html" %}
{% block content %}
<h1 class="h3 mb-3">{{ title }}</h1>
<form method="post" class="col-md-7">
  {% csrf_token %}
  {{ form.as_div }}
  <button class="btn btn-primary mt-3">Сохранить</button>
  <a class="btn btn-link mt-3" href="javascript:history.back()">Отмена</a>
</form>
{% endblock %}
