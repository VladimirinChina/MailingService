{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
  <h1 class="h3">Сообщения</h1>
  <a class="btn btn-primary" href="{% url 'mailings:message_create' %}">Добавить</a>
</div>
<table class="table table-striped">
  <thead><tr><th>Тема</th><th>Текст</th><th></th></tr></thead>
  <tbody>
  {% for m in object_list %}
    <tr>
      <td>{{ m.subject }}</td>
      <td>{{ m.body|truncatechars:80 }}</td>
      <td class="text-end">
        {% if m.owner_id == user.id %}
          <a class="btn btn-sm btn-outline-primary" href="{% url 'mailings:message_update' m.pk %}">Изменить</a>
          <a class="btn btn-sm btn-outline-danger" href="{% url 'mailings:message_delete' m.pk %}">Удалить</a>
        {% endif %}
      </td>
    </tr>
  {% empty %}
    <tr><td colspan="3">Пока пусто</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
